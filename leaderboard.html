<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyCircle - Leaderboard</title>
  
  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- BASE BACKGROUND COLOR (Locked tightly to dynamic viewport height and overflow hidden) -->
<body class="bg-[#FAE9CE] h-dvh w-screen overflow-hidden relative text-[#3D2013] flex flex-col justify-between select-none">

  <!-- 1. FIXED BACKGROUND TEXTURE LAYER -->
  <div class="fixed inset-0 pointer-events-none z-0"
       style="background-image: linear-gradient(rgba(61, 32, 19, 0.06) 1px, transparent 1px); background-size: 100% 5px;">
  </div>

  <!-- 2. AMBIENT GLOWS CONTAINER -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute right-[20%] sm:right-[25%] md:right-[90%] top-[10%] sm:top-[8%] w-[250px] h-[250px] sm:w-[450px] sm:h-[600px] rounded-full opacity-50 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.45) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute left-[20%] sm:left-[25%] md:left-[90%] top-[52%] sm:top-[54%] w-[250px] h-[250px] sm:w-[450px] sm:h-[600px] rounded-full opacity-50 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.45) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute left-[70%] sm:left-[75%] md:left-[80%] top-[-5%] w-[300px] h-[300px] sm:w-[500px] sm:h-[500px] rounded-full opacity-45 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.4) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute right-[75%] md:right-[85%] bottom-[5%] w-[300px] h-[300px] sm:w-[500px] sm:h-[500px] rounded-full opacity-45 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.4) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- HEADER LAYER WITH CLOSE BUTTON                                           -->
  <!-- ========================================================================= -->
<header class="relative z-20 pt-3 sm:pt-6 px-4 sm:px-6 w-full max-w-7xl mx-auto flex items-center justify-end shrink-0">
  <!-- Top Right Close (X) Button -->
  <button onclick="handleLeaderboardClose()" title="Close and Go Back" 
          style="border-radius: 50% !important;"
          class="w-8 h-8 sm:w-10 sm:h-10 bg-[#FEF4E0] border-[2px] md:border-[3px] border-[#3D2013] text-[#3D2013] hover:bg-[#E87339] hover:text-[#FFFFF6] transition-all duration-150 retro-shadow cursor-pointer flex items-center justify-center shrink-0">
    <svg class="w-4 h-4 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</header>

  <!-- ========================================================================= -->
  <!-- MAIN CONTENT AREA (Flex container set to strictly fit space)              -->
  <!-- ========================================================================= -->
  <main class="relative z-10 flex-1 w-full max-w-7xl mx-auto px-3 sm:px-6 pt-1 sm:pt-2 flex flex-col min-h-0 overflow-hidden">
    
    <!-- 1. LEFT-ALIGNED TITLE -->
    <h1 class="font-pressstart text-[18px] sm:text-[26px] md:text-[32px] text-[#482A1D] tracking-tight leading-none mb-3 sm:mb-5 shrink-0">
      Leaderboard
    </h1>

    <!-- 2. TAB BUTTONS (Responsive width without forcing screen overflow) -->
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0 mb-3 sm:mb-6 w-full">
      <button id="tab-global" onclick="switchLeaderboardTab('global')"
              class="flex-1 sm:flex-none sm:min-w-[150px] h-[38px] sm:h-[42px] flex items-center justify-center text-center bg-[#E87339] text-[#FFFFF6] border-[2px] sm:border-[3px] border-[#3D2013] !rounded-none px-2 sm:px-4 font-pressstart text-[9px] min-[380px]:text-[10px] sm:text-[12px] leading-tight tracking-tight cursor-default transition-all duration-150">
        GLOBAL
      </button>

      <button id="tab-friends" onclick="switchLeaderboardTab('friends')"
              class="flex-1 sm:flex-none sm:min-w-[150px] h-[38px] sm:h-[42px] flex items-center justify-center text-center bg-[#FAE9CE] text-[#3D2013] border-[2px] sm:border-[3px] border-[#3D2013] !rounded-none px-2 sm:px-4 font-pressstart text-[9px] min-[380px]:text-[10px] sm:text-[12px] leading-tight tracking-tight cursor-pointer flat-retro-shadow-hover transition-all duration-150">
        FRIENDS
      </button>

      <button id="tab-room" onclick="switchLeaderboardTab('room')"
              class="flex-1 sm:flex-none sm:min-w-[150px] h-[38px] sm:h-[42px] flex items-center justify-center text-center bg-[#FAE9CE] text-[#3D2013] border-[2px] sm:border-[3px] border-[#3D2013] !rounded-none px-2 sm:px-4 font-pressstart text-[9px] min-[380px]:text-[10px] sm:text-[12px] leading-tight tracking-tight cursor-pointer flat-retro-shadow-hover transition-all duration-150">
        ROOM
      </button>
    </div>

    <!-- 3. RANKINGS CONTAINER (Takes up remaining vertical space cleanly) -->
    <div class="bg-[#FEF4E0] border-t-[3px] border-x-[3px] border-[#3D2013] !rounded-none flex-1 flex flex-col overflow-hidden shadow-lg w-full min-h-0">
      
      <!-- HEADER -->
      <div class="bg-[#EBD9C4] border-b-[3px] border-[#3D2013] px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <!-- Award Icon Badge -->
          <div class="w-6 h-6 sm:w-7 sm:h-7 bg-[#FD923E] border-[2px] border-[#3D2013] flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#3D2013]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l2.4 5.26 5.6.49-4.2 3.86 1.22 5.48L12 14.37 7 17.09l1.22-5.48L4 7.75l5.6-.49L12 2z"/>
            </svg>
          </div>
          <h3 class="font-pressstart text-[11px] sm:text-sm text-[#3D2013]">RANKINGS</h3>
        </div>
      </div>

      <!-- BODY CONTAINERS FOR EACH TAB (ONLY THIS DIV IS SCROLLABLE) -->
      <div class="flex-1 p-2 sm:p-4 pb-24 sm:pb-28 overflow-y-auto min-h-0">
        
        <!-- GLOBAL FORM / TAB -->
        <div id="form-global" class="flex flex-col gap-2 sm:gap-2.5"></div>

        <!-- FRIENDS FORM / TAB -->
        <div id="form-friends" class="hidden flex flex-col gap-2 sm:gap-2.5"></div>

        <!-- ROOM FORM / TAB -->
        <div id="form-room" class="hidden flex flex-col gap-2 sm:gap-2.5"></div>

      </div>

    </div>

  </main>

<!-- ========================================================================= -->
<!-- FOOTER LAYER WITH GRADIENT OVERLAY & LOWER LEFT BRAND NAME                -->
<!-- ========================================================================= -->
<footer class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none h-20 sm:h-28 flex items-end">
  
  <!-- Solid-to-Transparent FEF4E0 Gradient Overlay -->
  <div class="absolute inset-0 z-0 bg-gradient-to-t from-[#FEF4E0] via-[#FEF4E0] to-transparent"></div>

  <!-- LOWER LEFT BRAND NAME & LOGO -->
  <div class="relative z-10 bottom-3 left-4 flex items-center gap-2 pointer-events-auto select-none">
    <img src="media/kitsu_logo.png" alt="Kitsu Logo" class="h-8 sm:h-9 md:h-10 w-auto block">
    <span class="font-pressstart text-[11px] md:text-[14px] text-[#4A2E21] hidden sm:block">StudyCircle</span>
  </div>

</footer>
  <script src="customavatar.js"></script> 
  <script src="leaderboard.js"></script>
</body>
</html>
