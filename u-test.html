<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyCircle</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles Sheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- 1. Global State & Utility Helpers (Must load before sidebar.js) -->
  <script src="global.js"></script>

  <!-- 2. Dynamic Sidebar Initialization -->
  <script src="sidebar.js"></script>
</head>

<!-- BASE BACKGROUND COLOR -->
<body class="bg-[#FAE9CE] min-h-screen relative text-[#3D2013] flex flex-col overflow-x-hidden">

  <!-- ==================== BACKGROUND TEXTURE LAYERS ==================== -->
  
  <!-- 1. FIXED BACKGROUND LINE GRID TEXTURE LAYER -->
  <div class="fixed inset-0 pointer-events-none z-0"
       style="background-image: linear-gradient(rgba(61, 32, 19, 0.06) 1px, transparent 1px); background-size: 100% 5px;">
  </div>

  <!-- 2. AMBIENT GLOWS CONTAINER -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute right-[20%] sm:right-[25%] md:right-[90%] top-[10%] sm:top-[8%] w-[250px] h-[250px] sm:w-[450px] sm:h-[600px] rounded-full opacity-50 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.45) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute left-[20%] sm:left-[25%] md:left-[90%] top-[52%] sm:top-[54%] w-[250px] h-[250px] sm:w-[450px] sm:h-[600px] rounded-full opacity-50 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.45) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute left-[70%] sm:left-[75%] md:left-[80%] top-[-5%] w-[300px] h-[300px] sm:w-[500px] sm:h-[500px] rounded-full opacity-45 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.4) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
    <div class="absolute right-[75%] md:right-[85%] bottom-[5%] w-[300px] h-[300px] sm:w-[500px] sm:h-[500px] rounded-full opacity-45 filter blur-3xl mix-blend-multiply"
         style="background: radial-gradient(circle, rgba(253, 146, 62, 0.4) 0%, rgba(253, 146, 62, 0) 70%);">
    </div>
  </div>

  <!-- ==================== MOBILE HEADER TRIGGER ==================== -->
  <header class="md:hidden sticky top-0 z-30 bg-[#FEF4E0] border-b-2 border-[#3D2013] p-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="media/kitsu_logo.png" alt="Kitsu Logo" class="w-7 h-7 object-contain">
      <span class="font-pressstart text-[11px] text-[#3D2013]">StudyCircle</span>
    </div>
    
    <button id="mobile-toggle-btn" aria-label="Open Menu" class="p-1.5 text-[#3D2013] bg-[#FDE4D0] border border-[#3D2013] rounded-md focus:outline-none cursor-pointer">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path id="mobile-toggle-icon" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </header>

  <!-- ==================== SIDEBAR OVERLAY CONTAINER ==================== -->
  <div id="sidebar-container"></div>

<!-- ==================== MAIN CONTENT WRAPPER ==================== -->
<div id="main-wrapper" class="relative z-10 flex-1 min-h-screen transition-all duration-300 md:pl-64 flex flex-col">
  
  <!-- Dynamic SPA Content Container -->
  <main id="app-content" class="flex-1 w-full p-0 m-0">
    <!-- Subpages load dynamically here via JavaScript router -->
  </main>

</div>
<!-- ==================== CLIENT ROUTER SCRIPT ==================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Determine initial subpage to fetch based on path (defaults to user-homepage.html)
      const currentFilename = window.location.pathname.split("/").pop();
      const initialPath = (!currentFilename || currentFilename === "index.html") 
        ? "user-homepage.html" 
        : currentFilename;

      loadPage(initialPath);

      // Intercept sidebar navigation clicks for seamless client-side page swapping
      document.addEventListener("click", (e) => {
        const link = e.target.closest("a.nav-item");
        if (link) {
          const targetHref = link.getAttribute("href");
          
          if (targetHref && !targetHref.startsWith("http") && !targetHref.startsWith("#")) {
            e.preventDefault();
            history.pushState(null, "", targetHref);
            loadPage(targetHref);
          }
        }
      });

      // Handle browser back/forward buttons
      window.addEventListener("popstate", () => {
        const activePath = window.location.pathname.split("/").pop() || "user-homepage.html";
        loadPage(activePath);
      });
    });

    // Dynamic Page Loader with Script Re-execution
    async function loadPage(pageUrl) {
      const container = document.getElementById("app-content");
      if (!container) return;

      try {
        const response = await fetch(pageUrl);
        if (!response.ok) throw new Error(`Could not load page ${pageUrl}`);

        const pageHtml = await response.text();

        // 1. Parse full HTML string into a DOM structure
        const parser = new DOMParser();
        const doc = parser.parseFromString(pageHtml, "text/html");

        // 2. Extract embedded script elements before injecting content
        const scripts = Array.from(doc.querySelectorAll("script"));
        scripts.forEach(script => script.remove());

        // 3. Inject page content (body content or full parsed body node)
        container.innerHTML = doc.body ? doc.body.innerHTML : pageHtml;

        // 4. Dynamically recreate and execute each extracted script
        for (const oldScript of scripts) {
          const newScript = document.createElement("script");

          // Copy attributes (src, type, defer, module, etc.)
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });

          // Handle inline scripts vs external script files
          if (oldScript.src) {
            await new Promise((resolve, reject) => {
              newScript.onload = resolve;
              newScript.onerror = reject;
              document.body.appendChild(newScript);
            });
          } else {
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
          }
        }

        // Re-render sidebar to update active state styling
        if (typeof renderSidebar === "function") {
          renderSidebar();
        }

        // Trigger subpage callback hook if defined
        if (typeof onPageLoaded === "function") {
          onPageLoaded(pageUrl);
        }
      } catch (error) {
        console.error("Router error:", error);
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 text-center">
            <h2 class="font-pressstart text-xl text-[#EA781C] mb-3">Page Not Found</h2>
            <p class="font-pixel text-xl text-[#3D2013]">Could not load: <code class="bg-[#FDE4D0] px-2 py-0.5 rounded border border-[#3D2013]">${pageUrl}</code></p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
